<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>แจ้งลาเรียนออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- SweetAlert2 สำหรับแจ้งเตือนสวยๆ -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-700 min-h-screen py-10 px-4 flex justify-center items-center">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white relative">
      <div class="flex justify-between items-center mb-2">
        <span class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-medium">
          <i class="fa-solid fa-graduation-cap"></i> School Portal
        </span>
        <button id="langToggle" type="button" class="px-3 py-1 rounded-full bg-white/20 hover:bg-white/30 text-white text-xs transition duration-200 backdrop-blur-md flex items-center gap-1.5 font-medium">
          <i class="fa-solid fa-globe"></i> <span>English</span>
        </button>
      </div>
      <h1 id="formTitle" class="text-2xl font-bold tracking-tight">ระบบแจ้งลาเรียนออนไลน์</h1>
      <p id="formSubTitle" class="text-blue-100 text-xs mt-1">กรอกข้อมูลการแจ้งลาของนักเรียนผ่านระบบอิเล็กทรอนิกส์</p>
    </div>

    <form id="leaveForm" class="p-6 space-y-5">
      <div>
        <label id="studentLabel" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">ชื่อ-นามสกุล นักเรียน *</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-regular fa-user"></i>
          </div>
          <input type="text" id="studentName" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200" required placeholder="ด.ช. สมชาย ใจดี">
        </div>
      </div>

      <div>
        <label id="gradeLabel" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">ระดับชั้น *</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-school"></i>
          </div>
          <select id="grade" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200 appearance-none" required>
            <option id="optSelectGrade" value="">-- เลือก --</option>
            <option>Nursery</option>
            <option>Kindergarten 1</option><option>Kindergarten 2</option><option>Kindergarten 3</option>
            <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
            <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
            <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
            <option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
          </select>
          <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-chevron-down text-xs"></i>
          </div>
        </div>
      </div>

      <div>
        <label id="leaveTypeLabel" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">รูปแบบการลา</label>
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
          <button type="button" id="btnFull" class="py-2 px-3 rounded-lg text-xs font-semibold bg-white text-indigo-600 shadow-sm transition duration-200 flex items-center justify-center gap-2">
            <i class="fa-regular fa-calendar-days"></i> <span id="btnFullText">ลาเต็มวัน</span>
          </button>
          <button type="button" id="btnPeriod" class="py-2 px-3 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-700 transition duration-200 flex items-center justify-center gap-2">
            <i class="fa-regular fa-clock"></i> <span id="btnPeriodText">ลาแบบเลือกคาบ</span>
          </button>
        </div>
      </div>

      <div id="fullDaySection" class="grid grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-100">
        <div>
          <label id="startLabel" class="block text-xs font-medium text-slate-500 mb-1">วันที่เริ่ม</label>
          <input type="date" id="startDate" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label id="endLabel" class="block text-xs font-medium text-slate-500 mb-1">วันที่สิ้นสุด</label>
          <input type="date" id="endDate" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div id="periodSection" class="hidden space-y-3 bg-slate-50 p-3.5 rounded-xl border border-slate-100">
        <div>
          <label id="singleDateLabel" class="block text-xs font-medium text-slate-500 mb-1">วันที่</label>
          <input type="date" id="singleDate" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label id="periodLabel" class="block text-xs font-medium text-slate-500 mb-2">คาบเรียนที่ต้องการลา</label>
          <div class="grid grid-cols-4 gap-2">
            <label class="cursor-pointer border border-slate-200 bg-white rounded-lg p-2 text-center hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-600">
              <input type="checkbox" name="period" value="คาบ 1" class="hidden">
              <span class="text-xs font-medium p-text">คาบ 1</span>
            </label>
            <label class="cursor-pointer border border-slate-200 bg-white rounded-lg p-2 text-center hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-600">
              <input type="checkbox" name="period" value="คาบ 2" class="hidden">
              <span class="text-xs font-medium p-text">คาบ 2</span>
            </label>
            <label class="cursor-pointer border border-slate-200 bg-white rounded-lg p-2 text-center hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-600">
              <input type="checkbox" name="period" value="คาบ 3" class="hidden">
              <span class="text-xs font-medium p-text">คาบ 3</span>
            </label>
            <label class="cursor-pointer border border-slate-200 bg-white rounded-lg p-2 text-center hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-600">
              <input type="checkbox" name="period" value="คาบ 4" class="hidden">
              <span class="text-xs font-medium p-text">คาบ 4</span>
            </label>
            <label class="cursor-pointer border border-slate-200 bg-white rounded-lg p-2 text-center hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-600">
              <input type="checkbox" name="period" value="คาบ 5" class="hidden">
              <span class="text-xs font-medium p-text">คาบ 5</span>
            </label>
            <label class="cursor-pointer border border-slate-200 bg-white rounded-lg p-2 text-center hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-600">
              <input type="checkbox" name="period" value="คาบ 6" class="hidden">
              <span class="text-xs font-medium p-text">คาบ 6</span>
            </label>
            <label class="cursor-pointer border border-slate-200 bg-white rounded-lg p-2 text-center hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-600">
              <input type="checkbox" name="period" value="คาบ 7" class="hidden">
              <span class="text-xs font-medium p-text">คาบ 7</span>
            </label>
          </div>
        </div>
      </div>

      <div>
        <label id="reasonLabel" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">เหตุผลการลา *</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-regular fa-comment-dots"></i>
          </div>
          <select id="reasonSelect" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200 appearance-none" required>
            <option id="optSelectReason" value="">-- เลือกเหตุผล --</option>
            <option id="optSick" value="ป่วย">ป่วย</option>
            <option id="optSport" value="แข่งกีฬา">แข่งกีฬา</option>
            <option id="optFamily" value="ธุระครอบครัว">ธุระครอบครัว</option>
            <option id="optOther" value="อื่นๆ">อื่นๆ</option>
          </select>
          <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-chevron-down text-xs"></i>
          </div>
        </div>
        <textarea id="reasonExtra" rows="3" class="mt-2.5 w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200 hidden" placeholder="โปรดระบุเหตุผลเพิ่มเติม"></textarea>
      </div>

      <div class="pt-2 border-t border-slate-100">
        <label id="policyTitleLabel" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">นโยบายการลา</label>
        <div id="policyBox" class="border border-slate-100 rounded-xl p-3 h-20 overflow-y-auto text-xs bg-slate-50 text-slate-500 leading-relaxed">
          กรุณาแจ้งลาล่วงหน้าอย่างน้อย 1 วัน หากป่วยกะทันหันโปรดส่งใบรับรองแพทย์ย้อนหลังภายใน 3 วันทำการ
        </div>
        <label class="flex items-start gap-2 text-xs text-slate-600 mt-3 cursor-pointer select-none">
          <input type="checkbox" required class="mt-0.5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
          <span id="policyLabel">ข้าพเจ้าได้อ่านและยอมรับนโยบายการลาของโรงเรียนแล้ว</span>
        </label>
      </div>

      <button id="submitBtn" type="submit" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane text-xs"></i> <span>ยืนยันการแจ้งลา</span>
      </button>
    </form>
  </div>

  <script>
    // **วาง Web App URL ของคุณที่นี่**
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx84wARPrhB8MpuM91oynrm_AswdmfG2ypTVob5t8zA-tsIyfa7wW66m7Mm9Q9-DyHJ/exec';

    let currentLeaveMode = 'full';

    const btnFull = document.getElementById('btnFull');
    const btnPeriod = document.getElementById('btnPeriod');
    const fullDaySection = document.getElementById('fullDaySection');
    const periodSection = document.getElementById('periodSection');

    btnFull.addEventListener('click', () => {
      currentLeaveMode = 'full';
      btnFull.className = "py-2 px-3 rounded-lg text-xs font-semibold bg-white text-indigo-600 shadow-sm transition duration-200 flex items-center justify-center gap-2";
      btnPeriod.className = "py-2 px-3 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-700 transition duration-200 flex items-center justify-center gap-2";
      fullDaySection.classList.remove('hidden');
      periodSection.classList.add('hidden');
    });

    btnPeriod.addEventListener('click', () => {
      currentLeaveMode = 'period';
      btnPeriod.className = "py-2 px-3 rounded-lg text-xs font-semibold bg-white text-indigo-600 shadow-sm transition duration-200 flex items-center justify-center gap-2";
      btnFull.className = "py-2 px-3 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-700 transition duration-200 flex items-center justify-center gap-2";
      fullDaySection.classList.add('hidden');
      periodSection.classList.remove('hidden');
    });

    const reasonSelect = document.getElementById('reasonSelect');
    const reasonExtra = document.getElementById('reasonExtra');
    reasonSelect.addEventListener('change', () => {
      if (reasonSelect.value === 'อื่นๆ') {
        reasonExtra.classList.remove('hidden');
        reasonExtra.required = true;
      } else if (reasonSelect.value !== '') {
        reasonExtra.classList.remove('hidden');
        reasonExtra.required = false;
      } else {
        reasonExtra.classList.add('hidden');
        reasonExtra.required = false;
      }
    });

    // Form Submit Event (ส่งข้อมูลเข้า Google Sheets)
    document.getElementById('leaveForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');

      let periods = [];
      if (currentLeaveMode === 'period') {
        document.querySelectorAll('input[name="period"]:checked').forEach(cb => {
          periods.push(cb.value);
        });
      }

      const payload = {
        studentName: document.getElementById('studentName').value,
        grade: document.getElementById('grade').value,
        leaveType: currentLeaveMode === 'full' ? 'ลาเต็มวัน' : 'ลาแบบเลือกคาบ',
        startDate: currentLeaveMode === 'full' ? document.getElementById('startDate').value : document.getElementById('singleDate').value,
        endDate: currentLeaveMode === 'full' ? document.getElementById('endDate').value : document.getElementById('singleDate').value,
        periods: periods.join(', '),
        reason: reasonSelect.value,
        reasonDetail: reasonExtra.value
      };

      Swal.fire({
        title: 'กำลังบันทึกข้อมูล...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        Swal.fire({
          icon: 'success',
          title: 'สำเร็จ!',
          text: 'แจ้งลาเรียนเรียบร้อยแล้ว',
          confirmButtonColor: '#4F46E5'
        });
        document.getElementById('leaveForm').reset();
        reasonExtra.classList.add('hidden');
      })
      .catch(error => {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด',
          text: 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง',
          confirmButtonColor: '#4F46E5'
        });
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      });
    });

    // Language Toggle
    let currentLang = 'th';
    const langToggle = document.getElementById('langToggle');
    const dictionary = {
      th: {
        toggleBtn: "English", formTitle: "ระบบแจ้งลาเรียนออนไลน์", formSubTitle: "กรอกข้อมูลการแจ้งลาของนักเรียนผ่านระบบอิเล็กทรอนิกส์",
        studentLabel: "ชื่อ-นามสกุล นักเรียน *", gradeLabel: "ระดับชั้น *", optSelectGrade: "-- เลือก --", leaveTypeLabel: "รูปแบบการลา",
        btnFullText: "ลาเต็มวัน", btnPeriodText: "ลาแบบเลือกคาบ", startLabel: "วันที่เริ่ม", endLabel: "วันที่สิ้นสุด",
        singleDateLabel: "วันที่", periodLabel: "คาบเรียนที่ต้องการลา", periodText: "คาบ ", reasonLabel: "เหตุผลการลา *",
        optSelectReason: "-- เลือกเหตุผล --", optSick: "ป่วย", optSport: "แข่งกีฬา", optFamily: "ธุระครอบครัว", optOther: "อื่นๆ",
        reasonPlaceholder: "โปรดระบุเหตุผลเพิ่มเติม", policyTitleLabel: "นโยบายการลา", policyBox: "กรุณาแจ้งลาล่วงหน้าอย่างน้อย 1 วัน หากป่วยกะทันหันโปรดส่งใบรับรองแพทย์ย้อนหลังภายใน 3 วันทำการ",
        policyLabel: "ข้าพเจ้าได้อ่านและยอมรับนโยบายการลาของโรงเรียนแล้ว", submitBtn: "ยืนยันการแจ้งลา"
      },
      en: {
        toggleBtn: "ไทย", formTitle: "Online Student Leave Form", formSubTitle: "Submit student leave request online",
        studentLabel: "Student Full Name *", gradeLabel: "Grade / Class *", optSelectGrade: "-- Select --", leaveTypeLabel: "Leave Type",
        btnFullText: "Full Day Leave", btnPeriodText: "Period Leave", startLabel: "Start Date", endLabel: "End Date",
        singleDateLabel: "Date", periodLabel: "Select Periods", periodText: "Period ", reasonLabel: "Reason for Leave *",
        optSelectReason: "-- Select Reason --", optSick: "Sick Leave", optSport: "Sports Event", optFamily: "Personal/Family Matter", optOther: "Other",
        reasonPlaceholder: "Please provide additional details", policyTitleLabel: "School Leave Policy", policyBox: "Please inform at least 1 day in advance. Medical certificate required for sick leave within 3 business days.",
        policyLabel: "I have read and agree to the school leave policy.", submitBtn: "Submit Leave Request"
      }
    };

    langToggle.addEventListener('click', () => {
      currentLang = currentLang === 'th' ? 'en' : 'th';
      const t = dictionary[currentLang];
      langToggle.querySelector('span').textContent = t.toggleBtn;
      document.getElementById('formTitle').textContent = t.formTitle;
      document.getElementById('formSubTitle').textContent = t.formSubTitle;
      document.getElementById('studentLabel').textContent = t.studentLabel;
      document.getElementById('gradeLabel').textContent = t.gradeLabel;
      document.getElementById('optSelectGrade').textContent = t.optSelectGrade;
      document.getElementById('leaveTypeLabel').textContent = t.leaveTypeLabel;
      document.getElementById('btnFullText').textContent = t.btnFullText;
      document.getElementById('btnPeriodText').textContent = t.btnPeriodText;
      document.getElementById('startLabel').textContent = t.startLabel;
      document.getElementById('endLabel').textContent = t.endLabel;
      document.getElementById('singleDateLabel').textContent = t.singleDateLabel;
      document.getElementById('periodLabel').textContent = t.periodLabel;
      document.getElementById('reasonLabel').textContent = t.reasonLabel;
      document.getElementById('optSelectReason').textContent = t.optSelectReason;
      document.getElementById('optSick').textContent = t.optSick;
      document.getElementById('optSport').textContent = t.optSport;
      document.getElementById('optFamily').textContent = t.optFamily;
      document.getElementById('optOther').textContent = t.optOther;
      document.getElementById('reasonExtra').placeholder = t.reasonPlaceholder;
      document.getElementById('policyTitleLabel').textContent = t.policyTitleLabel;
      document.getElementById('policyBox').textContent = t.policyBox;
      document.getElementById('policyLabel').textContent = t.policyLabel;
      document.getElementById('submitBtn').querySelector('span').textContent = t.submitBtn;
      document.querySelectorAll('.p-text').forEach((span, index) => {
        span.textContent = `${t.periodText}${index + 1}`;
      });
    });
  </script>
</body>
</html>
