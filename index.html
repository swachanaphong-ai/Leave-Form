<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>แจ้งลาเรียนออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="max-w-md mx-auto mt-6 bg-white p-6 rounded-lg shadow">
    <!-- ปุ่มเปลี่ยนภาษา -->
    <div class="flex justify-end mb-4">
      <button id="langToggle" type="button" class="px-3 py-1 rounded bg-blue-600 text-white text-sm">English</button>
    </div>

    <h1 id="formTitle" class="text-xl font-semibold text-blue-700 mb-4">ระบบแจ้งลาเรียนออนไลน์</h1>
    
    <form id="leaveForm" class="space-y-4">
      <!-- ชื่อ -->
      <div>
        <label id="studentLabel" class="block text-sm font-medium">ชื่อ-นามสกุล นักเรียน *</label>
        <input type="text" class="mt-1 w-full border rounded px-3 py-2" required>
      </div>

      <!-- ระดับชั้น -->
      <div>
        <label id="gradeLabel" class="block text-sm font-medium">ระดับชั้น *</label>
        <select class="mt-1 w-full border rounded px-3 py-2" required>
          <option id="optSelectGrade" value="">-- เลือก --</option>
          <option>Nursery</option>
          <option>Kindergarten 1</option>
          <option>Kindergarten 2</option>
          <option>Kindergarten 3</option>
          <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
          <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
          <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
          <option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
        </select>
      </div>

      <!-- รูปแบบการลา -->
      <div>
        <label id="leaveTypeLabel" class="block text-sm font-medium">รูปแบบการลา</label>
        <div class="flex gap-2 mt-2">
          <button type="button" id="btnFull" class="px-3 py-1.5 rounded bg-blue-600 text-white">ลาเต็มวัน</button>
          <button type="button" id="btnPeriod" class="px-3 py-1.5 rounded bg-gray-200">ลาแบบเลือกคาบ</button>
        </div>
      </div>

      <!-- Date Range สำหรับลาเต็มวัน -->
      <div id="fullDaySection" class="grid grid-cols-2 gap-2">
        <div>
          <label id="startLabel" class="text-sm">วันที่เริ่ม</label>
          <input type="date" class="mt-1 w-full border rounded px-3 py-2">
        </div>
        <div>
          <label id="endLabel" class="text-sm">วันที่สิ้นสุด</label>
          <input type="date" class="mt-1 w-full border rounded px-3 py-2">
        </div>
      </div>

      <!-- Date + Periods สำหรับลาแบบคาบ -->
      <div id="periodSection" class="hidden space-y-2">
        <div>
          <label id="singleDateLabel" class="text-sm">วันที่</label>
          <input type="date" class="mt-1 w-full border rounded px-3 py-2">
        </div>
        <div>
          <label id="periodLabel" class="text-sm">คาบเรียนที่ต้องการลา</label>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <label><input type="checkbox" value="คาบ 1"> <span class="p-text">คาบ 1</span></label>
            <label><input type="checkbox" value="คาบ 2"> <span class="p-text">คาบ 2</span></label>
            <label><input type="checkbox" value="คาบ 3"> <span class="p-text">คาบ 3</span></label>
            <label><input type="checkbox" value="คาบ 4"> <span class="p-text">คาบ 4</span></label>
            <label><input type="checkbox" value="คาบ 5"> <span class="p-text">คาบ 5</span></label>
            <label><input type="checkbox" value="คาบ 6"> <span class="p-text">คาบ 6</span></label>
            <label><input type="checkbox" value="คาบ 7"> <span class="p-text">คาบ 7</span></label>
          </div>
        </div>
      </div>

      <!-- เหตุผลการลา -->
      <div>
        <label id="reasonLabel" class="block text-sm font-medium">เหตุผลการลา *</label>
        <select id="reasonSelect" class="mt-1 w-full border rounded px-3 py-2" required>
          <option id="optSelectReason" value="">-- เลือกเหตุผล --</option>
          <option id="optSick" value="sick">ป่วย</option>
          <option id="optSport" value="sport">แข่งกีฬา</option>
          <option id="optFamily" value="family">ธุระครอบครัว</option>
          <option id="optOther" value="other">อื่นๆ</option>
        </select>
        <textarea id="reasonExtra" rows="3" class="mt-2 w-full border rounded px-3 py-2 hidden" placeholder="โปรดระบุเหตุผลเพิ่มเติม"></textarea>
      </div>

      <!-- นโยบาย -->
      <div>
        <label id="policyTitleLabel" class="block text-sm font-medium">นโยบายการลา</label>
        <div id="policyBox" class="border rounded p-2 h-24 overflow-y-auto text-sm bg-gray-50">
          กรุณาแจ้งลาล่วงหน้าอย่างน้อย 1 วัน หากป่วยกะทันหันโปรดส่งใบรับรองแพทย์ย้อนหลัง
        </div>
        <label class="flex items-center gap-2 text-sm mt-2">
          <input type="checkbox" required>
          <span id="policyLabel">ข้าพเจ้าได้อ่านและยอมรับนโยบายการลาของโรงเรียนแล้ว</span>
        </label>
      </div>

      <button id="submitBtn" type="submit" class="w-full py-2 rounded bg-blue-600 text-white">ยืนยันการแจ้งลา</button>
    </form>
  </div>

  <script>
    // Toggle sections
    const btnFull = document.getElementById('btnFull');
    const btnPeriod = document.getElementById('btnPeriod');
    const fullDaySection = document.getElementById('fullDaySection');
    const periodSection = document.getElementById('periodSection');

    btnFull.addEventListener('click', () => {
      btnFull.classList.add('bg-blue-600','text-white');
      btnFull.classList.remove('bg-gray-200');
      btnPeriod.classList.remove('bg-blue-600','text-white');
      btnPeriod.classList.add('bg-gray-200');
      fullDaySection.classList.remove('hidden');
      periodSection.classList.add('hidden');
    });

    btnPeriod.addEventListener('click', () => {
      btnPeriod.classList.add('bg-blue-600','text-white');
      btnPeriod.classList.remove('bg-gray-200');
      btnFull.classList.remove('bg-blue-600','text-white');
      btnFull.classList.add('bg-gray-200');
      fullDaySection.classList.add('hidden');
      periodSection.classList.remove('hidden');
    });

    // Reason select logic
    const reasonSelect = document.getElementById('reasonSelect');
    const reasonExtra = document.getElementById('reasonExtra');
    reasonSelect.addEventListener('change', () => {
      if (reasonSelect.value === 'other') {
        reasonExtra.classList.remove('hidden');
        reasonExtra.required = true;
      } else if (reasonSelect.value !== '') {
        reasonExtra.classList.remove('hidden');
        reasonExtra.required = false;
      } else {
        reasonExtra.classList.add('hidden');
        reasonExtra.required = false;
      }
    });

    // Language toggle logic
    let currentLang = 'th';
    const langToggle = document.getElementById('langToggle');

    const dictionary = {
      th: {
        toggleBtn: "English",
        formTitle: "ระบบแจ้งลาเรียนออนไลน์",
        studentLabel: "ชื่อ-นามสกุล นักเรียน *",
        gradeLabel: "ระดับชั้น *",
        optSelectGrade: "-- เลือก --",
        leaveTypeLabel: "รูปแบบการลา",
        btnFull: "ลาเต็มวัน",
        btnPeriod: "ลาแบบเลือกคาบ",
        startLabel: "วันที่เริ่ม",
        endLabel: "วันที่สิ้นสุด",
        singleDateLabel: "วันที่",
        periodLabel: "คาบเรียนที่ต้องการลา",
        periodText: "คาบ ",
        reasonLabel: "เหตุผลการลา *",
        optSelectReason: "-- เลือกเหตุผล --",
        optSick: "ป่วย",
        optSport: "แข่งกีฬา",
        optFamily: "ธุระครอบครัว",
        optOther: "อื่นๆ",
        reasonPlaceholder: "โปรดระบุเหตุผลเพิ่มเติม",
        policyTitleLabel: "นโยบายการลา",
        policyBox: "กรุณาแจ้งลาล่วงหน้าอย่างน้อย 1 วัน หากป่วยกะทันหันโปรดส่งใบรับรองแพทย์ย้อนหลัง",
        policyLabel: "ข้าพเจ้าได้อ่านและยอมรับนโยบายการลาของโรงเรียนแล้ว",
        submitBtn: "ยืนยันการแจ้งลา"
      },
      en: {
        toggleBtn: "ไทย",
        formTitle: "Online Student Leave System",
        studentLabel: "Student Full Name *",
        gradeLabel: "Grade / Class *",
        optSelectGrade: "-- Select --",
        leaveTypeLabel: "Leave Type",
        btnFull: "Full Day Leave",
        btnPeriod: "Period Leave",
        startLabel: "Start Date",
        endLabel: "End Date",
        singleDateLabel: "Date",
        periodLabel: "Select Periods",
        periodText: "Period ",
        reasonLabel: "Reason for Leave *",
        optSelectReason: "-- Select Reason --",
        optSick: "Sick Leave",
        optSport: "Sports Event",
        optFamily: "Personal/Family Matter",
        optOther: "Other",
        reasonPlaceholder: "Please provide additional details",
        policyTitleLabel: "School Leave Policy",
        policyBox: "Please inform at least 1 day in advance. Medical certificate required for sick leave.",
        policyLabel: "I have read and agree to the school leave policy.",
        submitBtn: "Submit Leave Request"
      }
    };

    langToggle.addEventListener('click', () => {
      currentLang = currentLang === 'th' ? 'en' : 'th';
      const t = dictionary[currentLang];

      langToggle.textContent = t.toggleBtn;
      document.getElementById('formTitle').textContent = t.formTitle;
      document.getElementById('studentLabel').textContent = t.studentLabel;
      document.getElementById('gradeLabel').textContent = t.gradeLabel;
      document.getElementById('optSelectGrade').textContent = t.optSelectGrade;
      document.getElementById('leaveTypeLabel').textContent = t.leaveTypeLabel;
      document.getElementById('btnFull').textContent = t.btnFull;
      document.getElementById('btnPeriod').textContent = t.btnPeriod;
      document.getElementById('startLabel').textContent = t.startLabel;
      document.getElementById('endLabel').textContent = t.endLabel;
      document.getElementById('singleDateLabel').textContent = t.singleDateLabel;
      document.getElementById('periodLabel').textContent = t.periodLabel;
      document.getElementById('reasonLabel').textContent = t.reasonLabel;
      document.getElementById('optSelectReason').textContent = t.optSelectReason;
      document.getElementById('optSick').textContent = t.optSick;
      document.getElementById('optSport').textContent = t.optSport;
      document.getElementById('optFamily').textContent = t.optFamily;
      document.getElementById('optOther').textContent = t.optOther;
      document.getElementById('reasonExtra').placeholder = t.reasonPlaceholder;
      document.getElementById('policyTitleLabel').textContent = t.policyTitleLabel;
      document.getElementById('policyBox').textContent = t.policyBox;
      document.getElementById('policyLabel').textContent = t.policyLabel;
      document.getElementById('submitBtn').textContent = t.submitBtn;

      // Update period checkbox labels
      document.querySelectorAll('.p-text').forEach((span, index) => {
        span.textContent = `${t.periodText}${index + 1}`;
      });
    });
  </script>
</body>
</html>
